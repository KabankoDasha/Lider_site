<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Автошкола Лидер</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/404.css">
    <link rel="stylesheet" href="../css/forma.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container header__inner">
            <a href="../pages/main.html" class="logo">
                <img src="../images/logo.svg" alt="Автошкола Лидер" class="logo__img">
            </a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="../pages/study.html">Обучение</a></li>
                    <li><a href="../pages/sale.html">Акции</a></li>
                    <li><a href="../pages/instructors.html">Инструкторы</a></li>
                    <li><a href="../pages/faq.html">Вопросы</a></li>
                    <li><a href="../pages/otzyv.html">Отзывы</a></li>
                    <li><a href="../pages/contact.html">Контакты</a></li>
                </ul>
            </nav>
            <a href="../pages/login.html" class="auth-btn btn btn--login">Войти</a>
        </div>
    </header>

    <main class="error-main">
        <div class="container error-container">
            <div class="error-content">
                <div class="error-code">404</div>
                <h1 class="error-title">Страница не найдена</h1>
                <p class="error-message">Возможно, вы перешли по неверной ссылке <br>или страница была удалена</p>
                <div class="error-actions">
                    <a href="../pages/main.html" class="btn--error-home">На главную</a>
                    <a href="javascript:history.back()" class="btn--error-back">Вернуться назад</a>
                </div>
            </div>

            <!-- Анимация колеса с полукругами -->
            <div class="error-animation">
                <div class="rolling-wheel">
                    <div class="wheel-big">
                        <!-- Чёрный круг -->
                        <div class="wheel-center"></div>
                        <!-- Белый круг -->
                        <div class="wheel-white"></div>
                        <!-- Полукруги (12 штук) -->
                        <div class="tooth t1"></div>
                        <div class="tooth t2"></div>
                        <div class="tooth t3"></div>
                        <div class="tooth t4"></div>
                        <div class="tooth t5"></div>
                        <div class="tooth t6"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/auth-check.js"></script>
    <script src="../js/load-form.js"></script>
    <script src="../js/scroll-to-top.js"></script>
    <script src="../js/search-index.js"></script>
    <script src="../js/search.js"></script> 
</body>
</html>
