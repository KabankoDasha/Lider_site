<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Автошкола Лидер</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/404.css">
    <link rel="stylesheet" href="/css/forma.css">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container header__inner">
            <a href="/main.html" class="logo desktop-only">
                <img src="/images/logo.svg" alt="Автошкола Лидер" class="logo__img">
            </a>
            <a href="/main.html" class="logo mobile-only">
                <img src="/images/logo-mobile.svg" alt="Автошкола Лидер" class="logo__img">
            </a>
            <!-- Мобильный телефон -->
            <a href="tel:+73517007400" class="header__phone mobile-only">
                <img src="/images/phone2.svg" alt="Телефон" class="header__phone-icon">
                +7(351) 700-74-00
            </a>
            <!-- Бургер-меню -->
            <button class="burger mobile-only" id="burger-btn" aria-label="Меню">
                <span class="burger__line"></span>
                <span class="burger__line"></span>
                <span class="burger__line"></span>
            </button>
            <!-- Десктопная навигация -->
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="/study.html">Обучение</a></li>
                    <li><a href="/sale.html">Акции</a></li>
                    <li><a href="/instructors.html">Инструкторы</a></li>
                    <li><a href="/faq.html">Вопросы</a></li>
                    <li><a href="/otzyv.html">Отзывы</a></li>
                    <li><a href="/contact.html">Контакты</a></li>
                </ul>
            </nav>
            <!-- Кнопка "Войти" скрыта на мобильных -->
            <a href="/login.html" class="auth-btn btn btn--login desktop-only">Войти</a>
        </div>
    </header>

    <!-- Мобильное меню (бургер) -->
    <div class="mobile-menu" id="mobile-menu">
        <nav class="mobile-menu__nav">
            <a href="/study.html" class="mobile-menu__link">Обучение</a>
            <a href="/sale.html" class="mobile-menu__link">Акции</a>
            <a href="/instructors.html" class="mobile-menu__link">Инструкторы</a>
            <a href="/faq.html" class="mobile-menu__link">Вопросы</a>
            <a href="/otzyv.html" class="mobile-menu__link">Отзывы</a>
            <a href="/contact.html" class="mobile-menu__link">Контакты</a>
            <a href="/login.html" class="mobile-menu__link mobile-menu__link--login" id="mobile-auth-btn">Войти</a>
        </nav>
    </div>

    <main class="error-main">
        <div class="error-container">
            <div class="error-content">
                <div class="error-code">404</div>
                <h1 class="error-title">Страница не найдена</h1>
                <p class="error-message">Возможно, вы перешли по неверной ссылке <br>или страница была удалена</p>
                <div class="error-actions">
                    <a href="/main.html" class="btn--error-home">На главную</a>
                    <a href="javascript:history.back()" class="btn--error-back">Вернуться назад</a>
                </div>
            </div>

            <!-- Анимация колеса с полукругами -->
            <div class="error-animation">
                <div class="rolling-wheel">
                    <div class="wheel-big">
                        <!-- Чёрный круг -->
                        <div class="wheel-center"></div>
                        <!-- Белый круг -->
                        <div class="wheel-white"></div>
                        <!-- Полукруги (12 штук) -->
                        <div class="tooth t1"></div>
                        <div class="tooth t2"></div>
                        <div class="tooth t3"></div>
                        <div class="tooth t4"></div>
                        <div class="tooth t5"></div>
                        <div class="tooth t6"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/auth-check.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/load-form.js"></script>
    <script src="/js/scroll-to-top.js"></script>
    <script src="/js/search-index.js"></script>
    <script src="/js/search.js"></script> 
</body>
</html>
