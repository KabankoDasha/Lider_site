server {
    listen 80;
    server_name lider-avto74.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name lider-avto74.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html;
    index main.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://api-maps.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api-maps.yandex.ru; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://maps.yandex.ru https://core-renderer-maps.yandex.ru https://yandex.ru; connect-src 'self' https://yandex.ru https://api-maps.yandex.ru https://mc.yandex.ru wss://; frame-src 'self' https://yandex.ru;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 404 /404.html;

    location ~ ^(.+)\.html$ {
        return 301 $scheme://$host$1;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = /404.html;
    }

    location /photos/ {
        proxy_pass http://backend:3001/photos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
